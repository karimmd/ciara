[run]
nodes = 5
duration_s = 3000
seed = 20261016
arrival = "mmpp"
load_scale = 1.0
model = "default"
mmpp_bin_s = 60

[presets.light]
load_scale = 0.5
[presets.nominal]
load_scale = 1.0
[presets.heavy]
load_scale = 2.0

[context]
epoch_s = 30
block_epochs = 50
mode = "pooled"
pooled_id = "pooled"
default_id = "light"
level_factor = { light = 0.5, heavy = 2.0 }
level_prob = { light = 0.5, heavy = 0.5 }

[families.1]
suite = "iot"
max_tokens = 512
[families.2]
suite = "sensor"
max_tokens = 1024

[request]
stream = true
temperature = 0
seed = 0
enable_thinking = false
include_usage = true

[mmpp]
states = ["calm", "burst"]
rel_rate = [1.0, 11.78]
mean_dwell_s = [247.2, 22.8]
modulation = "shared"
calibrate = "realized"
rate_heterogeneity_cv = 0.5

[classes.A]
role = "sensor"
radio = "nbiot"
devices_per_node = 40
base_rate_hz = 0.004167
cpu_share = 0.02
family_mix = { "1" = 0.1, "2" = 0.9 }
deadline_ms = { default = 60000, family_2 = 60000 }
timeout_s = 300
connection = { mode = "reuse", idle_close_s = 20 }
link_mix = { nbiot_cl0 = 0.7, nbiot_cl1 = 0.3 }
reference_device = "STM32L476 (Cortex-M4, 80 MHz) with an NB-IoT module"

[classes.B]
role = "actuator"
radio = "ltem"
devices_per_node = 20
base_rate_hz = 0.01
cpu_share = 0.04
family_mix = { "1" = 0.9, "2" = 0.1 }
deadline_ms = { default = 10000, family_2 = 60000 }
timeout_s = 120
connection = { mode = "reuse", idle_close_s = 60 }
link_mix = { ltem_good = 0.75, ltem_mid = 0.25 }
reference_device = "ESP32 (dual core, 240 MHz) with an LTE-M module"

[classes.C]
role = "camera"
radio = "nr"
devices_per_node = 8
base_rate_hz = 0.02
cpu_share = 0.4
family_mix = { "1" = 0.5, "2" = 0.5 }
deadline_ms = { default = 5000, family_2 = 60000 }
timeout_s = 60
connection = { mode = "reuse", idle_close_s = 120 }
link_mix = { nr_near = 0.6, nr_typical = 0.4 }
reference_device = "Raspberry Pi 4 Model B with a 5G module"


